apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard28-web
  labels:
    app: taskboard28-web
    app.kubernetes.io/name: taskboard28-web
    app.kubernetes.io/part-of: taskboard28
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard28-web.taskboard28-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard28-web
      port: 80
